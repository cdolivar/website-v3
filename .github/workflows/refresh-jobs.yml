name: Refresh job board
on:
  schedule:
    - cron: "0 13 * * *"   # daily, 13:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh-jobs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch listings and build page
        working-directory: job-board
        run: |
          python3 fetch_jobs.py
          python3 build.py --standalone
      - name: Publish to gh-pages /jobs/
        run: |
          mkdir -p pages/jobs
          cp job-board/index.html pages/jobs/index.html
          cd pages
          git config user.name "job-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh job board"
            git push origin gh-pages
          fi
