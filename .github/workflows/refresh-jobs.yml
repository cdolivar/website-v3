name: Refresh job board
on:
  schedule:
    # Four runs per weekday, spread across the US posting day (about 8am, 12pm, 4pm, 8pm Eastern in winter).
    # Odd minute on purpose: GitHub delays scheduled runs at the top of the hour. Weekends are skipped (about 2% of postings).
    - cron: "17 13,17,21 * * 1-5"   # Mon-Fri 13:17, 17:17, 21:17 UTC
    - cron: "17 1 * * 2-6"          # 01:17 UTC Tue-Sat = Mon-Fri evening in the US
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh-jobs
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch listings and build page
        working-directory: job-board
        run: |
          python3 fetch_jobs.py
          python3 build.py --standalone
      - name: Publish to gh-pages /jobs/
        run: |
          mkdir -p pages/jobs
          cp job-board/index.html pages/jobs/index.html
          cd pages
          git config user.name "job-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh job board"
            git push origin gh-pages
          fi
